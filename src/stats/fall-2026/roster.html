  =====================================================================
  This page reads from season_data.json, which is generated from
  seahawks-stats.xlsx (the Roster / Games / DNP Log / Game Log /

<style>
  :root {
    --navy: #002244;
    --navy-light: #0a3d67;
    --green: #69be28;
    --gray: #a5acaf;
    --paper: #f6f7f5;
    --ink: #16191c;
    --line: #dde1de;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.5;
  }

  h1, h2, h3, .num { font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 0.01em; }

  header { background: var(--navy); color: white; padding: 22px 24px; }

  .brand-row {
    max-width: 980px;
    margin: 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .brand-text h1 { margin: 0; font-size: 30px; text-transform: uppercase; line-height: 1; }
  .brand-text p { margin: 6px 0 0; color: var(--gray); font-size: 14px; }

  .back-link {
    color: var(--green);
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    display: none;
  }
  .back-link.show { display: inline-block; }

  main { max-width: 980px; margin: 0 auto; padding: 32px 24px 64px; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- Roster grid ---- */
  .roster-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .roster-controls h2 {
    margin: 0;
    font-size: 20px;
    text-transform: uppercase;
    color: var(--navy);
  }

  .sort-buttons { display: flex; gap: 6px; }
  .sort-buttons button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    background: white;
    border: 1px solid var(--line);
    color: var(--navy-light);
    padding: 7px 14px;
    border-radius: 3px;
    cursor: pointer;
  }
  .sort-buttons button.active { background: var(--navy); border-color: var(--navy); color: white; }

  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .roster-card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .roster-card:hover { border-color: var(--green); }

  .roster-card .card-num {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--green);
    background: var(--navy);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 3px;
    margin-bottom: 10px;
  }

  .roster-card h3 { margin: 0 0 2px; font-size: 17px; color: var(--navy); }
  .roster-card .position { font-size: 13px; color: var(--navy-light); font-weight: 600; }
  .roster-card .meta { font-size: 12.5px; color: var(--gray); margin-top: 6px; }

  /* ---- Player profile ---- */
  .profile-head {
    display: flex;
    align-items: center;
    gap: 18px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .profile-head .card-num {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 34px;
    color: var(--green);
    background: var(--navy);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 66px;
    height: 66px;
    border-radius: 4px;
    flex: none;
  }

  .profile-head h2 { margin: 0; font-size: 24px; color: var(--navy); text-transform: none; border: none; padding: 0; }
  .profile-head .position { color: var(--green-dark, var(--navy-light)); font-weight: 700; font-size: 14px; margin-top: 2px; }
  .profile-head .meta-row { display: flex; gap: 18px; margin-top: 8px; flex-wrap: wrap; }
  .profile-head .meta-row div { font-size: 13px; color: var(--gray); }
  .profile-head .meta-row strong { color: var(--ink); font-weight: 600; }

  section { margin-bottom: 32px; }
  section h2 {
    font-size: 18px;
    text-transform: uppercase;
    color: var(--navy);
    margin: 0 0 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--navy);
  }

  table { width: 100%; border-collapse: collapse; background: white; font-size: 14px; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  thead th {
    background: var(--navy); color: white; font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.02em;
  }
  tbody tr:nth-child(even) { background: #fafbfa; }
  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }

  .no-stats {
    background: white;
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 20px;
    text-align: center;
    color: var(--gray);
    font-size: 14px;
  }

  footer { text-align: center; color: var(--gray); font-size: 12.5px; padding: 20px 24px 40px; }

  .portal-nav {
    max-width: 980px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .portal-nav a {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 11px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 3px;
  }
  .portal-nav a:hover, .portal-nav a[aria-current="page"] { color: var(--navy); background: var(--green); border-color: var(--green); }
  .portal-nav .portal-home { margin-right: auto; color: var(--green); border-color: transparent; padding-left: 0; }

  @media (max-width: 600px) {
    .brand-text h1 { font-size: 24px; }
    th, td { font-size: 12.5px; padding: 7px 6px; }
  }
</style>

/* =====================================================================

function fullName(p) { return p.first + " " + p.last; }

const SUM_FIELDS = ["rushAtt","rushYds","rushTD","passAtt","passComp","passYds","passTD",
  "passInt","recTgt","rec","recYds","recTD","flagPull","sack","qbh","pbu","defInt","pickSix","onePt","twoPt"];
const MAX_FIELDS = ["rushLong","passLong","recLong"];

function emptyTotals() {
  const t = {};
  SUM_FIELDS.forEach(f => t[f] = 0);
  MAX_FIELDS.forEach(f => t[f] = 0);
  return t;
}

function seasonTotalsFor(name) {
  const t = emptyTotals();
  games.forEach(g => {
    const b = g.box[name];
    if (!b) return;
    SUM_FIELDS.forEach(f => t[f] += (b[f] || 0));
    MAX_FIELDS.forEach(f => t[f] = Math.max(t[f], b[f] || 0));
  });
  return t;
}

function pct(a, b) { return b ? ((a / b) * 100).toFixed(1) + "%" : "\u2014"; }

function gamesPlayedFor(name) {
  return games.filter(g => !(g.dnp || []).includes(name)).length;
}

   ===================================================================== */

function slugify(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }

let sortMode = "num";

function renderRoster() {
  const sorted = [...players].sort((a, b) =>
    sortMode === "num" ? a.num - b.num : fullName(a).localeCompare(fullName(b))
  );
  document.getElementById("roster-grid").innerHTML = sorted.map(p => `
    <div class="roster-card" data-player="${fullName(p)}">
      <div class="card-num">${p.num}</div>
      <h3>${fullName(p)}</h3>
      <div class="position">${p.position}</div>
      <div class="meta">${p.school} &middot; ${p.hometown}</div>
    </div>
  `).join("");

  document.querySelectorAll(".roster-card").forEach(card => {
    card.addEventListener("click", () => showProfile(card.dataset.player));
  });
}

    renderRoster();
  });
});

function statLine(label, cols, vals) {
  return `
    <div class="table-scroll">
      <table>
        <thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}</tr></thead>
        <tbody><tr>${vals.map(v => `<td>${v}</td>`).join("")}</tr></tbody>
      </table>
    </div>
  `;
}

function showProfile(name) {
  const p = players.find(pl => fullName(pl) === name);
  const s = seasonTotalsFor(name);
  const gp = gamesPlayedFor(name);

  let statsHtml = "";

  if (s.rushAtt > 0) {
    statsHtml += `<section><h2>Rushing</h2>${statLine("Rushing",
      ["Att", "Yds", "Avg", "TD", "Long"],
      [s.rushAtt, s.rushYds, (s.rushYds / s.rushAtt).toFixed(1), s.rushTD, s.rushLong])}</section>`;
  }
  if (s.passAtt > 0) {
    statsHtml += `<section><h2>Passing</h2>${statLine("Passing",
      ["Comp", "Att", "Pct", "Yds", "TD", "Int", "Long"],
      [s.passComp, s.passAtt, pct(s.passComp, s.passAtt), s.passYds, s.passTD, s.passInt, s.passLong])}</section>`;
  }
  if (s.recTgt > 0) {
    statsHtml += `<section><h2>Receiving</h2>${statLine("Receiving",
      ["Tgt", "Rec", "Yds", "TD", "Long"],
      [s.recTgt, s.rec, s.recYds, s.recTD, s.recLong])}</section>`;
  }
  if (s.flagPull > 0 || s.sack > 0 || s.qbh > 0 || s.pbu > 0 || s.defInt > 0 || s.pickSix > 0) {
    statsHtml += `<section><h2>Defense / Special Teams</h2>${statLine("Defense",
      ["Flag Pulls", "Sacks", "QB Hurries", "PBU", "Def INT", "Pick-6"],
      [s.flagPull, s.sack, s.qbh, s.pbu, s.defInt, s.pickSix])}</section>`;
  }
  if (s.onePt > 0 || s.twoPt > 0) {
    statsHtml += `<section><h2>Conversions</h2>${statLine("Conversions",
      ["1pt", "2pt"],
      [s.onePt, s.twoPt])}</section>`;
  }
  if (!statsHtml) {
    statsHtml = `<div class="no-stats">No stats recorded yet this season.</div>`;
  }

  const gameRows = games.map(g => {
    const dnp = (g.dnp || []).includes(name);
    const b = g.box[name] || {};
    const played = !dnp;
    return `<tr>
      <td>Week ${g.week}</td><td>vs ${g.opponent}</td>
      <td>${dnp ? "DNP" : "\u2713"}</td>
      <td>${b.rushYds !== undefined ? b.rushYds : (played ? "0" : "\u2014")}</td>
      <td>${b.recYds !== undefined ? b.recYds : (played ? "0" : "\u2014")}</td>
      <td>${b.passYds !== undefined ? b.passYds : (played ? "0" : "\u2014")}</td>
      <td>${b.flagPull !== undefined ? b.flagPull : (played ? "0" : "\u2014")}</td>
    </tr>`;
  }).join("");

  document.getElementById("view-profile").innerHTML = `
    <div class="profile-head">
      <div class="card-num">${p.num}</div>
      <div>
        <h2>${fullName(p)}</h2>
        <div class="position">${p.position}</div>
        <div class="meta-row">
          <div><strong>School:</strong> ${p.school}</div>
          <div><strong>Hometown:</strong> ${p.hometown}</div>
          <div><strong>Games played:</strong> ${gp}</div>
        </div>
      </div>
    </div>
    ${statsHtml}
    <section>
      <h2>Game-by-game</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Week</th><th>Opponent</th><th>Played</th><th>Rush Yds</th><th>Rec Yds</th><th>Pass Yds</th><th>Flag Pulls</th></tr></thead>
          <tbody>${gameRows}</tbody>
        </table>
      </div>
    </section>
  `;

  document.getElementById("view-roster").classList.remove("active");
  document.getElementById("view-profile").classList.add("active");
  document.getElementById("back-link").classList.add("show");
  document.getElementById("header-sub").textContent = fullName(p) + " \u2014 Player Profile";
  window.location.hash = slugify(name);
}

document.getElementById("back-link").addEventListener("click", () => {
  document.getElementById("view-profile").classList.remove("active");
  document.getElementById("view-roster").classList.add("active");
  document.getElementById("back-link").classList.remove("show");
  document.getElementById("header-sub").textContent = "Roster \u00b7 Fall 2026 Season";
  window.location.hash = "";
});

/* Deep-link support: seahawks-roster.html#lenni-bechtel opens straight
   to that player's profile. */
function tryOpenFromHash() {
  const slug = window.location.hash.replace("#", "");
  if (!slug) return;
  const match = players.find(p => slugify(fullName(p)) === slug);
  if (match) showProfile(fullName(match));
}

renderRoster();
tryOpenFromHash();
window.addEventListener("hashchange", tryOpenFromHash);
</script>

</body>
</html>
